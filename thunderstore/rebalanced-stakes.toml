# Thunderstore CLI (tcli) publishing config.
# Packages are built by scripts/build-thunderstore-package.sh; versionNumber is synced by sync-versions.sh.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Riosodu"
name = "Rebalanced_Stakes"
versionNumber = "1.3.8"
description = "Removes the -1 discard from blue stake, moving joker stickers to earlier stakes while completely reworking the gold stake to still be a challenge without restricting played hands"
websiteUrl = "https://github.com/gfreitash/balatro-mods"
containsNsfwContent = false

[package.dependencies]
"Steamodded-Steamodded" = "26.829.0"
"Thunderstore-lovely" = "0.10.0"

[build]
icon = "../rebalanced-stakes/icon.png"
readme = "../rebalanced-stakes/README.md"
outdir = "../dist"

[publish]
repository = "https://thunderstore.io"
communities = ["balatro"]

[publish.categories]
balatro = ["gameplay-tweaks", "misc"]
