# Thunderstore CLI (tcli) publishing config.
# Packages are built by scripts/build-thunderstore-package.sh; versionNumber is synced by sync-versions.sh.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Riosodu"
name = "QoL_Bundle"
versionNumber = "1.12.1"
description = "Balance and gameplay changes that feels good, configurable per feature. Bad mod name, too late now."
websiteUrl = "https://github.com/gfreitash/balatro-mods"
containsNsfwContent = false

[package.dependencies]
"Steamodded-Steamodded" = "26.829.0"
"Thunderstore-lovely" = "0.9.0"

[build]
icon = "../qol-bundle/icon.png"
readme = "../qol-bundle/README.md"
outdir = "../dist"

[publish]
repository = "https://thunderstore.io"
communities = ["balatro"]

[publish.categories]
balatro = ["qol", "gameplay-tweaks"]
