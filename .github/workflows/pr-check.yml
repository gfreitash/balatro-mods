name: PR Checks - Changelog Hygiene

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin "${{ github.base_ref }}"

      - name: Run changelog hygiene check
        run: ./scripts/check-changelogs.sh "origin/${{ github.base_ref }}"
